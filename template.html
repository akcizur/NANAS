<!DOCTYPE html>
<html lang="cs" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NANAS — Markdown → HTML → GitHub Pages">
  <title>NANAS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Google Sans"', "Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
            mono: ['"JetBrains Mono"', "Fira Code", "monospace"]
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="BetterText.css">

  <style>

    .back-to-top {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 40;
      width: 2.75rem;
      height: 2.75rem;
      border: 1px solid rgb(229 229 229);
      border-radius: 999px;
      background: rgba(255,255,255,0.94);
      color: rgb(23 23 23);
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.08);
    }

    .dark .back-to-top {
      border-color: rgb(64 64 64);
      background: rgba(23,23,23,0.94);
      color: rgb(245 245 245);
    }

    .back-to-top[hidden] {
      display: none;
    }

    .code-copy-wrap {
      position: relative;
      margin: 2rem 0 2.25rem;
    }

    .code-copy-wrap pre {
      margin: 0;
      padding-right: 5rem;
    }

    .code-copy {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      padding: 0.35rem 0.55rem;
      border: 1px solid rgb(64 64 64);
      border-radius: 0.5rem;
      background: rgb(23 23 23);
      color: rgb(212 212 212);
      font: 500 0.65rem/1 "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .code-copy:hover {
      color: #fff;
      border-color: rgb(115 115 115);
    }

    .dark .code-copy {
      background: rgb(17 17 17);
    }

    .post-action {
      min-height: 2rem;
      padding: 0.45rem 0.7rem;
      border-radius: 0.65rem;
      color: rgb(115 115 115);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background-color 160ms ease, color 160ms ease;
    }

    .post-action:hover {
      color: rgb(23 23 23);
      background: rgb(245 245 245);
    }

    .dark .post-action:hover {
      color: rgb(245 245 245);
      background: rgb(38 38 38);
    }

    .post-action.is-active {
      color: rgb(23 23 23);
      background: rgb(255 255 255);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
    }

    .dark .post-action.is-active {
      color: rgb(245 245 245);
      background: rgb(38 38 38);
    }

    .post-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid rgb(229 229 229);
    }

    .dark .post-toolbar {
      border-color: rgb(38 38 38);
    }

    .post-number {
      color: rgb(115 115 115);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .post-source {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: rgb(163 163 163);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.66rem;
      line-height: 1;
    }

    .post-source-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .post-source-dot {
      width: 0.36rem;
      height: 0.36rem;
      flex: 0 0 auto;
      border-radius: 999px;
      background: currentColor;
    }

    .post-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.1rem;
      padding: 0.18rem;
      border-radius: 0.8rem;
      background: rgb(245 245 245);
    }

    .dark .post-actions {
      background: rgb(23 23 23);
    }

    .post-preview[hidden],
    .post-markdown[hidden] {
      display: none;
    }

    .post-markdown {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-markdown code {
      display: block;
      min-width: 0;
    }

    @media (max-width: 640px) {
      .post-toolbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.75rem;
      }

      .post-actions {
        width: 100%;
      }

      .post-action {
        flex: 1 1 0;
      }
    }

    body {
      font-family: "Google Sans", "Inter", sans-serif;
    }

    ::selection {
      background: #000;
      color: #fff;
    }

    .dark ::selection {
      background: #fff;
      color: #000;
    }

    .content-width {
      max-width: var(--reading-width, 48rem);
    }

    .post-item > :first-child {
      margin-top: 0;
    }

    .post-item > :last-child {
      margin-bottom: 0;
    }
  </style>
</head>

<body class="min-h-screen bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 flex flex-col justify-between">
  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-neutral-950/80">
    <div class="max-w-4xl mx-auto px-6 sm:px-12 h-14 flex items-center justify-between">
      <h1 class="text-base sm:text-lg font-extrabold tracking-tight uppercase">NANAS</h1>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <div class="hidden md:flex items-center bg-neutral-100 dark:bg-neutral-900 p-1 rounded-xl text-xs" role="group" aria-label="Režim zobrazení">
          <button onclick="setViewMode('list')" id="btn-list" data-view-button="list" title="Seznam" class="px-2 py-1 rounded-lg font-medium">
            <i class="fas fa-bars"></i>
          </button>
          <button onclick="setViewMode('grid')" id="btn-grid" data-view-button="grid" title="Mřížka" class="px-2.5 py-1 rounded-lg font-medium">
            <i class="fas fa-th-large"></i>
          </button>
          <button onclick="setViewMode('magazine')" id="btn-magazine" data-view-button="magazine" title="Magazín" class="px-2.5 py-1 rounded-lg font-medium">
            <i class="fas fa-newspaper"></i>
          </button>
          <button onclick="setViewMode('compact')" id="btn-compact" data-view-button="compact" title="Kompaktní" class="px-2.5 py-1 rounded-lg font-medium">
            <i class="fas fa-list-ul"></i>
          </button>
        </div>

        <button onclick="toggleSettingsModal()" aria-label="Nastavení zobrazení" class="w-8 h-8 rounded-full flex items-center justify-center text-neutral-800 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-900">
          <i class="fas fa-sliders-h text-xs"></i>
        </button>

        <button id="modeToggle" aria-label="Přepnout režim zobrazení" class="w-8 h-8 rounded-full flex items-center justify-center text-neutral-800 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-900">
          <i class="fas fa-moon text-xs dark:hidden"></i>
          <i class="fas fa-sun text-xs hidden dark:block"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="w-full mx-auto px-5 sm:px-10 lg:px-12 py-16 sm:py-24 lg:py-28 flex-grow space-y-20 sm:space-y-28 content-width" id="main-container">
    <section class="space-y-6 sm:space-y-7">
      <h2 class="text-[2.45rem] sm:text-6xl lg:text-7xl font-extrabold tracking-[-0.04em] leading-[0.98] text-neutral-900 dark:text-white">
        Markdown &rarr; HTML &rarr; GitHub Pages
      </h2>
      <p class="text-base sm:text-xl text-neutral-600 dark:text-neutral-400 leading-[1.75] max-w-2xl">
        Tento web se generuje automaticky z adresáře <code>content/</code>. Každý Markdown soubor se při buildu převede na HTML a vykreslí postupně pod sebe.
      </p>
      <div>
        <code class="px-3.5 py-1.5 text-xs font-mono font-medium bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-200 rounded-lg inline-block">content/*.md</code>
      </div>
    </section>

    <section class="space-y-10 sm:space-y-12">
      <div class="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-900 pb-4">
        <div class="flex items-baseline gap-3">
          <h3 class="text-2xl sm:text-3xl font-bold tracking-[-0.025em] text-neutral-900 dark:text-white">Obsah</h3>
          <span id="post-count" class="text-[0.68rem] font-mono uppercase tracking-[0.16em] text-neutral-400 dark:text-neutral-500">{{postCount}}</span>
        </div>

        <div class="flex md:hidden items-center bg-neutral-100 dark:bg-neutral-900 p-1 rounded-lg text-xs" role="group" aria-label="Režim zobrazení">
          <button onclick="setViewMode('list')" data-view-button="list" class="px-2 py-1"><i class="fas fa-bars"></i></button>
          <button onclick="setViewMode('grid')" data-view-button="grid" class="px-2 py-1"><i class="fas fa-th-large"></i></button>
          <button onclick="setViewMode('magazine')" data-view-button="magazine" class="px-2 py-1"><i class="fas fa-newspaper"></i></button>
          <button onclick="setViewMode('compact')" data-view-button="compact" class="px-2 py-1"><i class="fas fa-list-ul"></i></button>
        </div>
      </div>

      <div id="posts-container" class="view-list" data-font-size="base" data-spacing="airy">
        {{content}}
      </div>
    </section>
  </main>

  <button id="backToTop" type="button" aria-label="Zpět nahoru" class="back-to-top" hidden>
    <i class="fas fa-arrow-up"></i>
  </button>

  <footer class="w-full bg-white dark:bg-neutral-950 border-t border-neutral-100 dark:border-neutral-900">
    <div class="max-w-4xl mx-auto px-6 sm:px-12 py-8 flex items-center justify-between text-xs text-neutral-500 dark:text-neutral-400 content-width">
      <div>
        <span class="font-bold text-neutral-900 dark:text-white tracking-wider">NANAS</span> &bull; Automated Markdown Publishing
      </div>
    </div>
  </footer>

  <div id="settingsModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-neutral-900 rounded-2xl max-w-md w-full p-7 sm:p-8 space-y-7 shadow-2xl border border-neutral-200/50 dark:border-neutral-800">
      <div class="flex items-center justify-between border-b border-neutral-100 dark:border-neutral-800 pb-4">
        <h3 class="text-lg font-bold tracking-tight text-neutral-900 dark:text-white">Nastavení zobrazení</h3>
        <button onclick="toggleSettingsModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-neutral-500 hover:bg-neutral-100 dark:hover:bg-neutral-800">
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>

      <div class="space-y-6 text-sm">
        <div class="space-y-2">
          <label class="font-medium text-neutral-700 dark:text-neutral-300 block">Šířka obsahu</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setReadingWidth('38rem')" id="width-narrow" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Úzká</button>
            <button onclick="setReadingWidth('48rem')" id="width-normal" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Střední</button>
            <button onclick="setReadingWidth('64rem')" id="width-wide" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Široká</button>
          </div>
        </div>

        <div class="space-y-2">
          <label class="font-medium text-neutral-700 dark:text-neutral-300 block">Velikost písma</label>
          <div class="grid grid-cols-3 gap-2">
            <button onclick="setFontSize('sm')" id="font-sm" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Malé</button>
            <button onclick="setFontSize('base')" id="font-base" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Střední</button>
            <button onclick="setFontSize('lg')" id="font-lg" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Velké</button>
          </div>
        </div>

        <div class="space-y-2">
          <label class="font-medium text-neutral-700 dark:text-neutral-300 block">Hustota mezer</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setSpacing('compact')" id="space-compact" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Kompaktní</button>
            <button onclick="setSpacing('airy')" id="space-airy" class="py-2 px-3 rounded-lg border border-neutral-200 dark:border-neutral-800 font-medium text-xs">Vzdušná</button>
          </div>
        </div>
      </div>

      <button onclick="toggleSettingsModal()" class="w-full py-2.5 rounded-xl bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 font-medium text-xs tracking-wide uppercase">
        Uložit nastavení
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <script>
    const htmlElement = document.documentElement;
    const postsContainer = document.getElementById("posts-container");

    const applyTheme = () => {
      const savedTheme = localStorage.getItem("theme");
      const dark = savedTheme === "dark" ||
        (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);

      htmlElement.classList.toggle("dark", dark);
      htmlElement.classList.toggle("light", !dark);
    };

    applyTheme();

    document.getElementById("modeToggle").addEventListener("click", () => {
      const dark = htmlElement.classList.toggle("dark");
      htmlElement.classList.toggle("light", !dark);
      localStorage.setItem("theme", dark ? "dark" : "light");
    });

    function toggleSettingsModal() {
      const modal = document.getElementById("settingsModal");
      modal.classList.toggle("hidden");
      modal.classList.toggle("flex");
    }

    function setReadingWidth(width) {
      document.documentElement.style.setProperty("--reading-width", width);
      localStorage.setItem("readingWidth", width);
      const map = { "38rem": "narrow", "48rem": "normal", "64rem": "wide" };

      Object.entries(map).forEach(([value, name]) => {
        const btn = document.getElementById("width-" + name);
        if (!btn) return;
        const active = value === width;
        btn.classList.toggle("bg-neutral-900", active);
        btn.classList.toggle("text-white", active);
        btn.classList.toggle("dark:bg-white", active);
        btn.classList.toggle("dark:text-neutral-900", active);
        btn.classList.toggle("border-transparent", active);
      });
    }

    function setFontSize(size) {
      postsContainer.dataset.fontSize = size;
      localStorage.setItem("fontSize", size);

      ["sm", "base", "lg"].forEach((value) => {
        const btn = document.getElementById("font-" + value);
        if (!btn) return;

        const active = value === size;
        btn.classList.toggle("bg-neutral-900", active);
        btn.classList.toggle("text-white", active);
        btn.classList.toggle("dark:bg-white", active);
        btn.classList.toggle("dark:text-neutral-900", active);
        btn.classList.toggle("border-transparent", active);
      });
    }

    function setSpacing(density) {
      postsContainer.dataset.spacing = density;
      localStorage.setItem("spacingDensity", density);

      ["compact", "airy"].forEach((value) => {
        const btn = document.getElementById("space-" + value);
        if (!btn) return;
        const active = value === density;
        btn.classList.toggle("bg-neutral-900", active);
        btn.classList.toggle("text-white", active);
        btn.classList.toggle("dark:bg-white", active);
        btn.classList.toggle("dark:text-neutral-900", active);
        btn.classList.toggle("border-transparent", active);
      });
    }

    function setViewMode(mode) {
      postsContainer.className = "view-" + mode;
      postsContainer.dataset.spacing = localStorage.getItem("spacingDensity") || postsContainer.dataset.spacing || "airy";
      postsContainer.dataset.fontSize = localStorage.getItem("fontSize") || postsContainer.dataset.fontSize || "base";
      localStorage.setItem("viewMode", mode);

      document.querySelectorAll("[data-view-button]").forEach((btn) => {
        const active = btn.dataset.viewButton === mode;
        btn.classList.toggle("bg-white", active);
        btn.classList.toggle("dark:bg-neutral-800", active);
        btn.classList.toggle("shadow-sm", active);
        btn.classList.toggle("text-black", active);
        btn.classList.toggle("dark:text-white", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });
    }

    function setPostMode(article, mode) {
      const preview = article.querySelector("[data-post-preview]");
      const markdown = article.querySelector("[data-post-markdown]");

      if (!preview || !markdown) return;

      const showMarkdown = mode === "markdown";
      preview.hidden = showMarkdown;
      markdown.hidden = !showMarkdown;

      article.querySelectorAll("[data-post-mode]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.postMode === mode);
        button.setAttribute("aria-pressed", button.dataset.postMode === mode ? "true" : "false");
      });

      article.dataset.postMode = mode;
    }

    async function copyText(text, button, successLabel = "Copied") {
      try {
        await navigator.clipboard.writeText(text);
        const label = button.querySelector(".post-copy-label");
        const previous = label ? label.textContent : "";
        if (label) label.textContent = successLabel;
        window.setTimeout(() => {
          if (label) label.textContent = previous || "Copy";
        }, 1400);
      } catch {
        const label = button.querySelector(".post-copy-label");
        if (label) label.textContent = "Select";
        window.setTimeout(() => {
          if (label) label.textContent = "Copy";
        }, 1400);
      }
    }

    function enhancePostInteractions() {
      document.querySelectorAll(".post-item").forEach((article) => {
        const defaultMode = article.dataset.postMode || "preview";

        article.querySelectorAll("[data-post-mode]").forEach((button) => {
          button.addEventListener("click", () => {
            setPostMode(article, button.dataset.postMode);
          });
        });

        const copyButton = article.querySelector("[data-copy-markdown]");
        const markdown = article.querySelector("[data-post-markdown]");

        if (copyButton && markdown) {
          copyButton.addEventListener("click", () => {
            copyText(markdown.textContent.trim(), copyButton);
          });
        }

        setPostMode(article, defaultMode);
      });

      document.querySelectorAll(".post-preview pre").forEach((pre) => {
        const code = pre.querySelector("code");
        if (!code || pre.querySelector(".code-copy")) return;

        const wrapper = document.createElement("div");
        wrapper.className = "code-copy-wrap";
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const button = document.createElement("button");
        button.type = "button";
        button.className = "code-copy";
        button.textContent = "Copy";
        button.setAttribute("aria-label", "Kopírovat kód");

        button.addEventListener("click", () => {
          copyText(code.textContent, button, "Copied");
          window.setTimeout(() => {
            button.textContent = "Copy";
          }, 1400);
        });

        wrapper.appendChild(button);
      });
    }

    const backToTop = document.getElementById("backToTop");
    const settingsModal = document.getElementById("settingsModal");

    function updateBackToTop() {
      backToTop.hidden = window.scrollY < 560;
    }

    backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    window.addEventListener("scroll", updateBackToTop, { passive: true });

    settingsModal.addEventListener("click", (event) => {
      if (event.target === settingsModal) toggleSettingsModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (!settingsModal.classList.contains("hidden")) toggleSettingsModal();
        return;
      }

      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;

      if (event.key === "1") setViewMode("list");
      if (event.key === "2") setViewMode("grid");
      if (event.key === "3") setViewMode("magazine");
      if (event.key === "4") setViewMode("compact");
      if (event.key.toLowerCase() === "t") document.getElementById("modeToggle").click();
    });

    window.addEventListener("DOMContentLoaded", () => {
      setViewMode(localStorage.getItem("viewMode") || "list");
      setReadingWidth(localStorage.getItem("readingWidth") || "48rem");
      setFontSize(localStorage.getItem("fontSize") || "base");
      setSpacing(localStorage.getItem("spacingDensity") || "airy");
      enhancePostInteractions();
      updateBackToTop();
    });
  </script>
</body>
</html>
